# Hugo 中文站构建并发布到 GitHub Pages（DR-004：Pages source = GitHub Actions）
#
# 流程：checkout → 装工具链（Python/Go/Node/Hugo 0.148.2 extended）→
#       tools/build_site.py 组装 build_site/（上游全量 + zh/ 覆盖）→
#       npm install → hugo --gc --minify → upload-pages-artifact → deploy-pages
#
# Hugo 版本锁定 0.148.2 extended，理由见 tools/build_site.py 内注释与
# docs/decision_log.md DR-003。
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go（Hugo modules 拉取 docsy）
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hugo extended 0.148.2
        run: |
          HUGO_VERSION=0.148.2
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          hugo version

      - name: Assemble site（组装 build_site/，baseURL 默认项目 Pages 地址）
        run: python tools/build_site.py

      - name: Install node deps
        run: npm install --prefix build_site --no-fund --no-audit

      - name: Build
        run: |
          cd build_site
          export NODE_PATH="$PWD/node_modules"
          hugo --gc --minify -d public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
